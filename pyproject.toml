[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashlla"
version = "0.1.0"
description = "Efficient Triton kernels for Local Linear Attention"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Yifei Zuo" }]
keywords = ["attention", "triton", "linear-attention", "transformer", "gpu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "triton>=2.1",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Yifei-Zuo/FlashLLA"
Issues = "https://github.com/Yifei-Zuo/FlashLLA/issues"

[tool.setuptools.packages.find]
include = ["flashlla*"]
exclude = ["tests*", "examples*"]
